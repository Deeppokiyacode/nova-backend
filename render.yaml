services:
  - type: web
    name: nova-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/chat/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_AUTH_REQUIRED
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        value: nova-backend.onrender.com
      - key: DJANGO_CORS_ORIGINS
        sync: false
